<svg width="1280" height="150" viewBox="0 0 1280 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040816"/>
      <stop offset="0.48" stop-color="#081229"/>
      <stop offset="1" stop-color="#10204F"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 75) rotate(90) scale(90 180)">
      <stop stop-color="#4F46E5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1035 75) rotate(90) scale(95 200)">
      <stop stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="strokeA" x1="860" y1="20" x2="1160" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <style>
      .eyebrow { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #7DD3FC; letter-spacing: 2.4px; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .desc { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="1280" height="150" rx="18" fill="url(#bg)"/>

  <circle cx="260" cy="75" r="90" fill="url(#glowLeft)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1035" cy="75" r="95" fill="url(#glowRight)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.14;0.28;0.14" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- subtle cinematic background shape -->
  <g opacity="0.18">
    <g transform="translate(915 28)">
      <animateTransform attributeName="transform" type="translate" values="915 28;915 24;915 28" dur="8s" repeatCount="indefinite"/>

      <polygon points="90,0 160,40 160,118 90,150 20,118 20,40" stroke="url(#strokeA)" stroke-width="1.4" fill="none"/>
      <polygon points="90,28 136,54 136,104 90,126 44,104 44,54" stroke="url(#strokeA)" stroke-width="1" fill="none" opacity="0.65"/>

      <line x1="90" y1="0" x2="90" y2="150" stroke="url(#strokeA)" stroke-width="0.8" opacity="0.55"/>
      <line x1="20" y1="40" x2="160" y2="118" stroke="url(#strokeA)" stroke-width="0.8" opacity="0.35"/>
      <line x1="160" y1="40" x2="20" y2="118" stroke="url(#strokeA)" stroke-width="0.8" opacity="0.35"/>

      <circle cx="90" cy="75" r="3.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="40" r="3" fill="#A78BFA">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="118" r="3" fill="#60A5FA">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- subtle grid hints -->
  <g opacity="0.07" stroke="#7C8CFF" stroke-width="1">
    <line x1="0" y1="44" x2="1280" y2="44"/>
    <line x1="0" y1="108" x2="1280" y2="108"/>
    <line x1="340" y1="0" x2="340" y2="150"/>
    <line x1="760" y1="0" x2="760" y2="150"/>
  </g>

  <text x="640" y="54" text-anchor="middle" class="eyebrow">BACKEND ENGINEERING · WEB3 · REAL-TIME SYSTEMS</text>
  <text x="640" y="88" text-anchor="middle" class="title">Clean Code. Scalable Systems. Real Impact.</text>
  <text x="640" y="114" text-anchor="middle" class="desc">Always learning. Always building.</text>
</svg>