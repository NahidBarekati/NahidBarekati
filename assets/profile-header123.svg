    <line x1="915" y1="430" x2="1280" y2="70" stroke="#173A80" stroke-width="1"/>
  </g>

  <text x="76" y="150" class="title">Nahid Barekati</text>
  <text x="76" y="205" class="subtitle">Senior Backend Developer</text>

  <rect x="76" y="228" width="170" height="4" rx="2" fill="url(#accent)"/>

  <text x="76" y="282" class="body">
    <tspan x="76" dy="0">I design and build resilient backend systems, real-time platforms, and</tspan>
    <tspan x="76" dy="40">decentralized applications that power great user experiences.</tspan>
  </text>

  <g>
