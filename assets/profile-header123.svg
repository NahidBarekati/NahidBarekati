    <circle cx="88" cy="66" r="2" fill="#6F8FFF"/>
    <circle cx="108" cy="66" r="2" fill="#6F8FFF"/>
    <circle cx="128" cy="66" r="2" fill="#6F8FFF"/>
    <circle cx="148" cy="66" r="2" fill="#6F8FFF"/>
    <circle cx="168" cy="66" r="2" fill="#6F8FFF"/>

    <circle cx="68" cy="86" r="2" fill="#6F8FFF"/>
    <circle cx="88" cy="86" r="2" fill="#6F8FFF"/>
    <circle cx="108" cy="86" r="2" fill="#6F8FFF"/>
    <circle cx="128" cy="86" r="2" fill="#6F8FFF"/>
    <circle cx="148" cy="86" r="2" fill="#6F8FFF"/>
    <circle cx="168" cy="86" r="2" fill="#6F8FFF"/>

    <circle cx="68" cy="106" r="2" fill="#6F8FFF"/>
    <circle cx="88" cy="106" r="2" fill="#6F8FFF"/>
    <circle cx="108" cy="106" r="2" fill="#6F8FFF"/>
    <circle cx="128" cy="106" r="2" fill="#6F8FFF"/>
