<svg width="1280" height="430" viewBox="0 0 1280 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040817"/>
      <stop offset="0.55" stop-color="#05123B"/>
      <stop offset="1" stop-color="#10256F"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 76) rotate(90) scale(220 340)">
      <stop stop-color="#7C8CFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1070 290) rotate(90) scale(180 240)">
      <stop stop-color="#6A5BFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6A5BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#C65CFF"/>
    </linearGradient>

    <linearGradient id="lineStroke" x1="790" y1="40" x2="1230" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39A0FF"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <style>
      .title { font: 800 82px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #6F8FFF; }
      .body { font: 400 27px 'Segoe UI', Arial, sans-serif; fill: #D9E2F0; }
      .pill-text { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .soft { opacity: 0.6; }
    </style>
  </defs>

  <rect width="1280" height="430" rx="0" fill="url(#bg)"/>

  <circle cx="1050" cy="76" r="220" fill="url(#glowA)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1070" cy="300" r="180" fill="url(#glowB)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.45">
