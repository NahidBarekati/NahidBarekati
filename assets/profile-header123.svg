      </circle>
      <circle cx="176" cy="46" r="4">
        <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="162" r="4" fill="#C65CFF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="110" r="4" fill="#C65CFF">
