    </g>
    <g class="float">
      <path class="cube draw" d="M575 245 L690 180 L805 245 L690 312 Z M575 245 V375 L690 443 L805 375 V245 M690 312 V443" style="animation-delay:.9s"/>
      <path class="cubeThin" d="M612 265 L690 222 L768 265 M612 315 L690 360 L768 315"/>
    </g>
    <g class="float2" opacity="0.78">
      <path class="cube draw" d="M735 120 L840 62 L945 120 L840 180 Z M735 120 V240 L840 303 L945 240 V120 M840 180 V303" style="animation-delay:1.25s"/>
    </g>
    <g filter="url(#softGlow)">
      <circle class="spark" cx="330" cy="202" r="4" fill="#60A5FA"/>
      <circle class="spark2" cx="530" cy="148" r="4" fill="#C084FC"/>
      <circle class="spark" cx="690" cy="312" r="4" fill="#60A5FA" style="animation-delay:1s"/>
