    <path class="streak slide" d="M120 115 C270 10 430 -20 590 -95"/>
    <path class="streak slide" d="M80 255 C250 145 450 95 645 -30" style="animation-delay: .6s"/>
    <path class="streak slide" d="M135 485 C300 370 455 290 640 195" style="animation-delay: 1.2s"/>
    <path class="dash" d="M235 70 L615 -80"/>
