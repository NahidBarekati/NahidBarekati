<svg width="1280" height="590" viewBox="0 0 1280 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nahid Barekati | Senior Backend Developer</title>
  <desc id="desc">A cinematic animated GitHub profile hero for Nahid Barekati, senior backend developer focused on scalable backend systems, Web3 platforms, crypto payments, real-time infrastructure, and AI agent workflows.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030712" />
      <stop offset="0.44" stop-color="#07111F" />
      <stop offset="1" stop-color="#12143A" />
      <animate attributeName="x1" values="0;90;0" dur="16s" repeatCount="indefinite" />
      <animate attributeName="x2" values="1280;1160;1280" dur="16s" repeatCount="indefinite" />
    </linearGradient>

    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 246) rotate(89) scale(430 520)">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.58" />
      <stop offset="0.45" stop-color="#4F46E5" stop-opacity="0.18" />
      <stop offset="1" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 96) rotate(110) scale(360 520)">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="meshLine" x1="780" y1="68" x2="1190" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.52" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.72" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.50 0 0 0 0 1 0 0 0 0.74 0" result="color" />
      <feMerge>
        <feMergeNode in="color" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="deepShadow" x="-12%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 760; letter-spacing: 4px; fill: #7DD3FC; }
      .name { font-size: 74px; font-weight: 860; fill: #F8FAFC; }
      .role { font-size: 31px; font-weight: 760; fill: #93C5FD; }
      .body { font-size: 18px; font-weight: 440; fill: #CBD5E1; }
      .micro { font-size: 12px; font-weight: 720; letter-spacing: 2px; fill: #94A3B8; }
      .chipText { font-size: 13px; font-weight: 700; fill: #E5E7EB; }
      .contactText { font-size: 14px; font-weight: 720; fill: #F8FAFC; }
      .contactSub { font-size: 11px; font-weight: 650; fill: #93C5FD; letter-spacing: 1px; }
      .chip { fill: #0B1224; fill-opacity: 0.74; stroke: #60A5FA; stroke-opacity: 0.26; }
      .contact { fill: #0A1020; fill-opacity: 0.74; stroke: #60A5FA; stroke-opacity: 0.30; }
      .grid { stroke: #60A5FA; stroke-opacity: 0.12; }
      .mesh { stroke: url(#meshLine); stroke-width: 1.4; stroke-opacity: 0.72; fill: none; }
      .meshSoft { stroke: #93C5FD; stroke-width: 1; stroke-opacity: 0.20; fill: none; }
      .orbit { stroke: #60A5FA; stroke-width: 1; stroke-opacity: 0.24; fill: none; }
      .node { fill: #60A5FA; filter: url(#softGlow); }
      .nodeViolet { fill: #A78BFA; filter: url(#softGlow); }
    </style>
