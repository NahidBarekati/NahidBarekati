    </g>
    <g transform="translate(478 684)">
      <rect class="badge" width="288" height="74" rx="8"/><text class="badgeText" x="74" y="47">API Architecture</text><path d="M35 29 L25 42 L35 55 M67 29 L77 42 L67 55 M47 58 L56 26" stroke="#60A5FA" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(783 684)">
      <rect class="badge" width="321" height="74" rx="8"/><text class="badgeText" x="74" y="47">AI Agent Workflows</text><path d="M51 22 C39 22 35 32 39 41 C31 45 32 58 44 60 C47 69 60 69 63 60 C75 58 76 45 68 41 C72 32 63 22 51 22 Z M51 22 V66 M39 41 H63 M44 60 H58" stroke="#7C8CFF" stroke-width="3" fill="none"/>
    </g>
  </g>

